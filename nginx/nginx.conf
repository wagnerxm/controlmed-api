##############################################
# Nginx — Reverse proxy com HTTPS
# controlcheck.duckdns.org
##############################################

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    client_max_body_size 100m;

    gzip on;
    gzip_types application/json text/plain text/css;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream api_backend {
        server api:3000;
    }

    # ── HTTP → redireciona para HTTPS ──
    server {
        listen 80;
        server_name controlcheck.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl http2;
        server_name controlcheck.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/controlcheck.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/controlcheck.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://api_backend/api/health;
        }

        location / {
            return 200 '{"service":"controlcheck-api","status":"running","https":true}';
            add_header Content-Type application/json;
        }
    }
}
