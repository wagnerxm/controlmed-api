##############################################
# Nginx — Reverse proxy para ControlCheck API
# HTTP → redireciona pra HTTPS (quando configurado)
# HTTPS → proxy para api:3000
##############################################

events {
    worker_connections 1024;
}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Tamanho máximo de upload (fotos)
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/css;

    # Rate limiting básico
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream: API Node.js ──
    upstream api_backend {
        server api:3000;
    }

    # ── HTTP (porta 80) ──
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Proxy API (funciona sem HTTPS pra teste inicial)
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check direto
        location /health {
            proxy_pass http://api_backend/api/health;
        }

        # Root
        location / {
            return 200 '{"service":"controlcheck-api","status":"running"}';
            add_header Content-Type application/json;
        }
    }

    # ── HTTPS (porta 443) — descomentar após certbot ──
    # server {
    #     listen 443 ssl http2;
    #     server_name SEU_DOMINIO_AQUI;
    #
